<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eight Projects — Bientôt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --ink:         #0a0a0a;
    --paper:       #f6f2ea;
    --bone:        #d8d0bd;
    --line:        rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.22);
    --muted:       rgba(246,242,234,0.58);
    --muted-2:     rgba(246,242,234,0.40);
    --sans:        "Helvetica Neue", Helvetica, Arial, sans-serif;
    --display:     "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --mono:        "Geist Mono", ui-monospace, "SF Mono", monospace;
    --ease:        cubic-bezier(.2,.7,.2,1);
    --pad-x:       clamp(24px, 5vw, 96px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(216,208,189,0.06), transparent 60%),
      radial-gradient(900px 700px at -10% 60%, rgba(216,208,189,0.04), transparent 70%),
      var(--ink);
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--paper); color: var(--ink); }

  /* ---- layout ---- */
  .cs {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--pad-x);
    z-index: 10;
  }

  /* ---- corners ---- */
  .cs__top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .cs__bot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .label b { color: var(--paper); font-weight: 500; }

  /* ---- logo ---- */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand__name {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---- center ---- */
  .cs__center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
  }

  .cs__eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadein .8s var(--ease) .2s forwards;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bone);
    box-shadow: 0 0 12px rgba(216,208,189,.6);
  }

  .cs__title {
    font-family: var(--display);
    font-size: clamp(48px, 8vw, 120px);
    font-weight: 200;
    line-height: .95;
    letter-spacing: -.02em;
    color: var(--paper);
    opacity: 0;
    transform: translateY(20px);
    animation: fadein 1s var(--ease) .4s forwards;
  }

  .cs__title em {
    font-style: italic !important;
    color: var(--bone);
  }

  .cs__sub {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    max-width: 40ch;
    line-height: 1.8;
    opacity: 0;
    transform: translateY(10px);
    animation: fadein .8s var(--ease) .7s forwards;
  }

  /* ---- line ---- */
  .cs__line {
    position: fixed;
    left: var(--pad-x);
    right: var(--pad-x);
    bottom: calc(var(--pad-x) + 52px);
    height: 1px;
    background: var(--line);
    z-index: 10;
  }

  /* ---- countdown ---- */
  .countdown {
    display: flex;
    gap: 40px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadein .8s var(--ease) 1s forwards;
  }

  .countdown__item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .countdown__num {
    font-family: var(--display);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 200;
    letter-spacing: -.02em;
    color: var(--paper);
    line-height: 1;
    min-width: 2ch;
  }

  .countdown__label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  .countdown__sep {
    font-family: var(--display);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 200;
    color: var(--muted-2);
    align-self: flex-start;
    line-height: 1;
    margin-top: 2px;
  }

  /* ---- noise overlay ---- */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
    z-index: 100;
  }

  /* ---- anim ---- */
  @keyframes fadein {
    to { opacity: 1; transform: none; }
  }

  /* ---- responsive ---- */
  @media (max-width: 600px) {
    .cs__bot .label:last-child { display: none; }
    .countdown { gap: 24px; }
  }
</style>
</head>

<script>
  // Liquid background — WebGL canvas
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;";
  document.body.appendChild(canvas);

  const gl = canvas.getContext("webgl");

  const vert = `
    attribute vec2 a_pos;
    void main(){ gl_Position = vec4(a_pos,0,1); }
  `;

  const frag = `
    precision highp float;
    uniform vec2  u_res;
    uniform vec2  u_mouse;
    uniform float u_time;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f*f*(3.-2.*f);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }

    float fbm(vec2 p){
      float v=0., a=.5;
      for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.1+vec2(1.7,9.2); a*=.5; }
      return v;
    }

    void main(){
      vec2 uv  = gl_FragCoord.xy / u_res;
      vec2 m   = u_mouse / u_res;
      float t  = u_time * 0.18;

      vec2 distort = vec2(
        fbm(uv * 2.5 + t + vec2(0., 1.3)),
        fbm(uv * 2.5 + t + vec2(5.2, 3.7))
      );

      float pull = 1.0 - smoothstep(0.0, 0.55, distance(uv + distort * 0.08, m));
      distort += pull * 0.18 * normalize(m - uv + 0.001);

      vec2 warped = uv + distort * 0.12;

      float f = fbm(warped * 3.0 + t * 0.6);
      float g = fbm(warped * 1.8 - t * 0.4 + 4.1);

      float blob = smoothstep(0.38, 0.62, f * 0.6 + g * 0.4);
      blob += pull * 0.25;
      blob = clamp(blob, 0., 1.);

      vec3 ink   = vec3(0.039, 0.039, 0.039);
      vec3 warm  = vec3(0.847, 0.816, 0.745);
      vec3 glow  = vec3(0.55,  0.50,  0.40);

      vec3 col = mix(ink, mix(warm * 0.12, glow * 0.18, blob), blob * 0.85);
      col += pull * 0.04 * warm;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s); return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, "a_pos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, "u_res");
  const uMouse = gl.getUniformLocation(prog, "u_mouse");
  const uTime  = gl.getUniformLocation(prog, "u_time");

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let cx = mx, cy = my;

  document.addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; });

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize); resize();

  function lerp(a,b,t){ return a+(b-a)*t; }

  function frame(t){
    cx = lerp(cx, mx, 0.04);
    cy = lerp(cy, my, 0.04);
    gl.uniform2f(uRes,   canvas.width, canvas.height);
    gl.uniform2f(uMouse, cx, canvas.height - cy);
    gl.uniform1f(uTime,  t * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Countdown — change la date cible ici
  const target = new Date("2026-05-28T00:00:00");

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    const now  = new Date();
    const diff = Math.max(0, target - now);
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    const secs  = Math.floor((diff % 60000)    / 1000);
    document.getElementById("cd-days").textContent  = pad(days);
    document.getElementById("cd-hours").textContent = pad(hours);
    document.getElementById("cd-mins").textContent  = pad(mins);
    document.getElementById("cd-secs").textContent  = pad(secs);
  }

  tick();
  setInterval(tick, 1000);

  // Clock Paris
  function clock() {
    const t = new Date().toLocaleTimeString("fr-FR", {
      timeZone: "Europe/Paris",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });
    document.getElementById("clock").textContent = t + " · PARIS";
  }
  clock();
  setInterval(clock, 1000);
</script>

</body>
</html>
